name: agoccare
description: AgocCare - Online Medicine & Healthcare App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP & API
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  photo_view: ^0.14.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  badges: ^3.1.2
  fl_chart: ^0.67.0
  syncfusion_flutter_charts: ^24.2.8

  # Image Picker & Camera
  image_picker: ^1.0.7
  permission_handler: ^11.3.1

  # Forms & Validation
  form_validator: ^2.1.1

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.6
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.0.3
  timeago: ^3.6.1

  # Payment
  razorpay_flutter: ^1.3.6

  # Fonts
  google_fonts: ^6.2.1

  # Env
  flutter_dotenv: ^5.1.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.7.1
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env

  # Fonts loaded via google_fonts package at runtime
